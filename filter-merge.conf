# rebuild on each GET; no independent updater schedule
listen=127.0.0.1:3054
work_dir=/overlay/filter-merge/work
chunk_bytes=2097152
max_input_bytes=33554432
max_output_bytes=33554432
max_line_bytes=8192
max_sources=32
max_run_files=128
download_timeout_secs=15
build_timeout_secs=55

# repeat url= for each source; use your current AdGuard subscriptions
url=https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
